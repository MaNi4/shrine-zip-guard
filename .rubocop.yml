AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/FileName:
  Exclude:
    - lib/shrine-zip-guard.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - shrine-zip-guard.gemspec

Style/Documentation:
  Enabled: false
